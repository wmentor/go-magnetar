version: "1.0"

language: english  # language for agent responses (default: english)
verbose: true       # enable verbose tool call output (default: true)

profile: default

rag:
  enable: true
  store:
    type: chromem
  chunk:
    size: 2048
    overlap: 256
  search:
    limit: 10
    threshold: 0.40
    multi_query: 2
    dedup_threshold: 0.95
  qdrant:
    connstr: http://localhost:6334
    collection: documents
  chromem:
    data_dir: ~/.go-magnetar/store
    collection: documents
  llm:
    base_url: https://api.openai.com/v1
    api_key: sk-embed-test
    model: text-embedding-3-small
    vector_size: 1536

profiles:
  default:
    llm:
      base_url: https://api.openai.com/v1
      api_key: sk-test-key
      model: gpt-4o
      context: 128000
      temperature: 0.9
      top_p: 0.95
      reasoning_effort: high

compact:
  threshold: 0
  save_tail: 6
