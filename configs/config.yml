---

language: english  # language for agent responses (default: english)
verbose: true       # enable verbose tool call output (default: true)

profile: default

profiles:
  default:
    llm:
      base_url: https://api.openai.com/v1
      api_key: YOUR_API_KEY
      model: gpt-4o
      context: 128000
      temperature: 0.9   # LLM temperature for response generation (default: 0.9)
      top_p: 0.95        # LLM top_p for response generation (default: 0.95)
      reasoning_effort: high  # reasoning effort: low, medium, or high (default: high)

rag:
  enable: false  # enable/disable RAG (default: false)
  llm:
    base_url: https://api.openai.com/v1
    api_key: YOUR_API_KEY
    model: text-embedding-3-small
    vector_size: 1536
  chunk:
    # size: maximum size of a chunk in runes (default: 2048)
    size: 2048
    # overlap: number of runes that overlap between adjacent chunks (default: 256)
    overlap: 256
  search:
    # limit: maximum number of results returned per query (default: 10)
    limit: 10
    # threshold: minimum cosine-similarity score 0-1 (default: 0.40)
    threshold: 0.40
    # multi_query: number of additional query reformulations generated by the LLM
    # to improve recall. 0 disables multi-query. Each extra query adds one
    # embedding call + one Qdrant call. Recommended: 1-3. (default: 2)
    multi_query: 2
    # dedup_threshold: cosine similarity above which two result chunks are
    # considered near-duplicates; the lower-scoring one is dropped.
    # 0 disables deduplication. Recommended: 0.92-0.95. (default: 0.95)
    dedup_threshold: 0.95
  qdrant:
    connstr: http://localhost:6333
    collection: documents

compact:
  # threshold: token count at which history summarization is triggered.
  # If not set (or 0), defaults to 80 % of llm.context.
  threshold: 0
  # save_tail: number of most-recent messages to preserve unchanged during
  # summarization. If less than 1, all non-system messages are summarized.
  save_tail: 6

webfetch:
  enable: false  # disable web page preprocessing (default: false)
  base_url: https://api.openai.com/v1
  api_key: YOUR_API_KEY
  model: gpt-4o
  context: 128000

confluence:
  enable: false  # enable/disable Confluence fetching (default: false)
  base_url: https://your-domain.atlassian.net
  api_key: YOUR_API_KEY

jira:
  enable: false  # enable/disable JIRA fetching (default: false)
  base_url: https://jira.example.com
  api_key: YOUR_API_KEY

gitlab:
  enable: false  # enable/disable GitLab fetching (default: false)
  base_url: https://gitlab.example.com
  api_key: YOUR_API_KEY

github:
  enable: false  # enable/disable GitHub integration (default: false)
  base_url: https://api.github.com
  access_key: YOUR_API_KEY

guard:
  enable: false  # disable guard agent for exec commands (default: false)
  ask: false  # ask user for confirmation when guard blocks a command (default: false)

ssh:
  enable: false  # disable SSH execution (default: false)
  user: $env:USER  # SSH username (optional, defaults to current user)
  key: ~/.ssh/id_rsa  # SSH private key path (optional, supports ~)
  password: ""  # SSH password (optional)
  use_ssh_agent: false  # use ssh-agent for authentication (default: false)
  remote_dir: ""  # remote working directory (optional, default: $HOME)
  timeout: 120  # SSH command timeout in seconds (default: 120)
