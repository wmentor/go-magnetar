llm:
  base_url: https://api.openai.com/v1
  api_key: YOUR_API_KEY
  model: gpt-4o
  context: 128000

rag:
  disable: false
  llm:
    base_url: https://api.openai.com/v1
    api_key: YOUR_API_KEY
    model: text-embedding-3-small
    vector_size: 1536
  chunk:
    # size: maximum size of a chunk in runes (default: 512)
    size: 512
    # overlap: number of runes that overlap between adjacent chunks (default: 64)
    overlap: 64
  search:
    # limit: maximum number of results returned per query (default: 10)
    limit: 10
    # threshold: minimum cosine-similarity score 0–1 (default: 0.40)
    threshold: 0.40
    # multi_query: number of additional query reformulations generated by the LLM
    # to improve recall. 0 disables multi-query. Each extra query adds one
    # embedding call + one Qdrant call. Recommended: 1–3. (default: 2)
    multi_query: 2
    # dedup_threshold: cosine similarity above which two result chunks are
    # considered near-duplicates; the lower-scoring one is dropped.
    # 0 disables deduplication. Recommended: 0.92–0.95. (default: 0.95)
    dedup_threshold: 0.95
  qdrant:
    connstr: http://localhost:6333
    collection: documents

verbose: true

compact:
  # threshold: token count at which history summarization is triggered.
  # If not set (or 0), defaults to 80 % of llm.context.
  threshold: 0
  # save_tail: number of most-recent messages to preserve unchanged during
  # summarization. If less than 1, all non-system messages are summarized.
  save_tail: 6

webfetch:
  base_url: https://api.openai.com/v1
  api_key: YOUR_API_KEY
  model: gpt-4o
  context: 128000
  disable: false

confluence:
  base_url: https://your-domain.atlassian.net
  api_key: YOUR_API_KEY
  disable: false

jira:
  base_url: https://jira.example.com
  api_key: YOUR_API_KEY
  disable: false

gitlab:
  base_url: https://gitlab.example.com
  api_key: YOUR_API_KEY
  disable: false

github:
  base_url: https://api.github.com
  api_key: YOUR_API_KEY
  disable: false

